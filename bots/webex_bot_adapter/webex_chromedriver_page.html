<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Webex Meetings SDK</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px; height: 100%; padding: 4px; box-sizing: border-box; }
      .tile { position: relative; background: #000; }
      .tile video { width: 100%; height: 100%; object-fit: contain; }
      .tile .label { position: absolute; left: 8px; bottom: 8px; color: #fff; font: 14px sans-serif; background: rgba(0,0,0,.5); padding: 2px 6px; }
    </style>
  </head>
  <body>
    <main>
      <div id="videos"></div>
      <!-- The audio slots are played here, which puts the meeting audio into the browser's output -->
      <div id="remoteMedia"></div>
    </main>

    <script src="https://unpkg.com/webex@3.12.0/umd/webex.min.js"></script>
    <script src="webex_chromedriver_page.js"></script>
  </body>
</html>
