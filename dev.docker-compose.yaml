services:
  attendee-worker-local:
    build: ./
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
      - STORAGE_PROTOCOL=minio
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
    command: "celery -A attendee worker -l INFO"

  attendee-scheduler-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - STORAGE_PROTOCOL=minio
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
    command: "python manage.py run_scheduler"
    entrypoint: []

  attendee-app-local:
    build: ./
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - STORAGE_PROTOCOL=minio
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: []

  attendee-webpage-streamer-local:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=true
      - STORAGE_PROTOCOL=minio
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
    command: "python bots/webpage_streamer/run_webpage_streamer.py"
    security_opt:
      - seccomp=./bots/web_bot_adapter/chrome_seccomp.json
    profiles:
      - webpage-streamer


  postgres:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_DB: attendee_development
      POSTGRES_USER: attendee_development_user
      POSTGRES_PASSWORD: attendee_development_user
      PGDATA: /data/postgres
    volumes:
       - postgres:/data/postgres
    networks:
      - attendee_network
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    networks:
      - attendee_network
    restart: unless-stopped
    volumes:
      - redis:/data/redis

  minio:
    # MinIO no longer publishes Docker images, Chainguard builds this one from the MinIO sources
    image: chainguard/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - attendee_network

  storage-init:
    build: ./
    volumes:
     - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - STORAGE_PROTOCOL=minio
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
    command: python manage.py create_storage_buckets
    entrypoint: []
    depends_on:
      - minio

networks:
  attendee_network:
    driver: bridge

volumes:
  postgres:
  redis:
  minio_data:
