  attendee-scheduler-local:
    image: attendee-local:arm64
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.arm64
  attendee-webpage-streamer-local:
    image: attendee-local:arm64
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.arm64
