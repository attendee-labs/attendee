name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # The Ubuntu jobs keep their original names, so required status checks still match.
    name: "Tests: ${{ matrix.test_suite }}${{ matrix.image != 'ubuntu' && format(' ({0})', matrix.image) || '' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the default image (Dockerfile); debian is the opt-in Dockerfile.debian.
        image: [ubuntu, debian]
        test_suite: [smoke, zoom, google_meet, teams_and_zoom_web, others]
        include:
          - image: ubuntu
            dockerfile: Dockerfile
          - image: debian
            dockerfile: Dockerfile.debian
          - test_suite: zoom
            test_args: "--tag zoom_tests"
          - test_suite: google_meet
            test_args: "--tag google_meet_tests"
          - test_suite: teams_and_zoom_web
            test_args: "--tag teams_tests --tag zoom_web_tests"
          - test_suite: others
            test_args: "--exclude-tag zoom_tests --exclude-tag google_meet_tests --exclude-tag teams_tests --exclude-tag zoom_web_tests"

    services:
      postgres:
        image: postgres:15.3-alpine
        env:
          POSTGRES_DB: attendee_test
          POSTGRES_USER: attendee_test_user
          POSTGRES_PASSWORD: attendee_test_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: attendee-test:latest
          cache-from: type=gha,scope=attendee-test${{ matrix.image != 'ubuntu' && format('-{0}', matrix.image) || '' }}
          cache-to: type=gha,scope=attendee-test${{ matrix.image != 'ubuntu' && format('-{0}', matrix.image) || '' }},mode=min

      # Native libraries, GStreamer elements, FFmpeg, Chrome and CLI tools the bots rely on.
      - name: Run smoke test
        if: matrix.test_suite == 'smoke'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/.github/scripts/image-smoke-test.sh:/smoke-test.sh:ro" \
            --entrypoint bash \
            attendee-test:latest /smoke-test.sh

      - name: "Run ${{ matrix.test_suite }} tests"
        if: matrix.test_suite != 'smoke'
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/5
          DJANGO_SETTINGS_MODULE: attendee.settings.test
        run: |
          docker run --rm \
            --network host \
            -e POSTGRES_HOST \
            -e REDIS_URL \
            -e DJANGO_SETTINGS_MODULE \
            attendee-test:latest bash -lc '
              set -e
              python init_env.py > /tmp/.env
              python -m dotenv -f /tmp/.env run -- python manage.py test --keepdb ${{ matrix.test_args }} --verbosity 2
            '

  lint:
    name: Run linting
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint (GitHub annotations)
        run: |
          echo "::group::ruff check"
          ruff check . --output-format=github
          echo "::endgroup::"
      - name: Ruff format (check + diff)
        run: |
          echo "::group::ruff format --check --diff"
          ruff format --check --diff .
          echo "::endgroup::"