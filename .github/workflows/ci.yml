name: CI

on:
  push:
    branches: [ spectrocloud ]
  pull_request:
    branches: [ spectrocloud ]

permissions:
  contents: read

jobs:
  test:
    name: "Tests: ${{ matrix.test_suite }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_suite: zoom
            test_args: "--tag zoom_tests"
          - test_suite: google_meet
            test_args: "--tag google_meet_tests"
          - test_suite: teams_and_zoom_web
            test_args: "--tag teams_tests --tag zoom_web_tests"
          - test_suite: others
            test_args: "--exclude-tag zoom_tests --exclude-tag google_meet_tests --exclude-tag teams_tests --exclude-tag zoom_web_tests"

    services:
      postgres:
        image: postgres:15.3-alpine
        env:
          POSTGRES_DB: attendee_test
          POSTGRES_USER: attendee_test_user
          POSTGRES_PASSWORD: attendee_test_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and cache Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: attendee-test:latest
          cache-from: type=gha,scope=attendee-test
          cache-to: type=gha,scope=attendee-test,mode=min

      - name: "Run ${{ matrix.test_suite }} tests"
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/5
          DJANGO_SETTINGS_MODULE: attendee.settings.test
        run: |
          docker run --rm \
            --network host \
            -e POSTGRES_HOST \
            -e REDIS_URL \
            -e DJANGO_SETTINGS_MODULE \
            attendee-test:latest bash -lc '
              set -e
              python init_env.py > /tmp/.env
              python -m dotenv -f /tmp/.env run -- python manage.py test --keepdb ${{ matrix.test_args }} --verbosity 2
            '

  lint:
    name: Run linting
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint (GitHub annotations)
        run: |
          echo "::group::ruff check"
          ruff check . --output-format=github
          echo "::endgroup::"
      - name: Ruff format (check + diff)
        run: |
          echo "::group::ruff format --check --diff"
          ruff format --check --diff .
          echo "::endgroup::"
