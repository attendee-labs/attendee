name: Create Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          upstream_version=$(jq -r '.version' version.json)
          if [[ ! "$upstream_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream version: $upstream_version"
            exit 1
          fi

          last_tag=""
          while IFS= read -r tag; do
            last_tag=$tag
            break
          done < <(git tag --list "v${upstream_version}-sp.*" --sort=-version:refname)
          revision=${last_tag##*-sp.}
          if [[ -n "$last_tag" && "$revision" =~ ^[0-9]+$ ]]; then
            revision=$((revision + 1))
          else
            revision=1
          fi

          echo "release_as=${upstream_version}-sp.${revision}" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
          versioning-strategy: service-pack
          release-as: ${{ steps.version.outputs.release_as }}

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Log in to Amazon ECR
        uses: ./.github/actions/ecr-login
        with:
          aws_iam_role: ${{ secrets.CI_CD_IAM_ROLE }}
          aws_region: us-west-2
          registry_type: private

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: 607374883620.dkr.ecr.us-west-2.amazonaws.com/tricorder/attendee:${{ needs.release-please.outputs.tag_name }}
