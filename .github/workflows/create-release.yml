name: Create Release

on:
  push:
    branches: [ main ]
    paths:
      - version.json

jobs:
  release:
    runs-on: ubuntu-latest

    permissions: # needed to push tags and create releases
      contents: write

    outputs:
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' version.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "version.json does not contain a valid .version"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Ensure tag does not already exist
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the version in version.json."
            exit 1
          fi

      - name: Create annotated tag and push
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes

  docker:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions: # needed to push Docker images to GHCR
      contents: read
      packages: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.release.outputs.tag }}

  navigation-configs:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false

    permissions:
      contents: read

    env:
      CONFIG_DIR: bots/web_bot_adapter/navigation_configs
      # Must match the path of REMOTE_NAVIGATION_CONFIGS_BASE_URL in bots/web_bot_adapter/navigation_config.py.
      KEY_PREFIX: configs
      # How long Cloudflare's edge may serve a stale config after a release.
      CACHE_MAX_AGE_SECONDS: 300

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Upload navigation configs to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_NAVIGATION_CONFIGS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_NAVIGATION_CONFIGS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't support all of the checksum headers newer AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_NAVIGATION_CONFIGS_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_NAVIGATION_CONFIGS_BUCKET }}
        run: |
          set -euo pipefail
          for path in "$CONFIG_DIR"/*.json; do
            key="$KEY_PREFIX/$(basename "$path")"
            aws s3api put-object \
              --endpoint-url "$R2_ENDPOINT" \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --body "$path" \
              --content-type application/json \
              --cache-control "public, max-age=$CACHE_MAX_AGE_SECONDS" \
              > /dev/null
            echo "Uploaded $path to r2://$R2_BUCKET/$key"
          done