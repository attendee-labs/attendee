name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Validate PR title + version.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node (for version check script)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch base branch (for version.json on main/base)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Validate version.json matches expected bump from PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          function die(msg) {
            console.error("\n❌ " + msg + "\n");
            process.exit(1);
          }

          function parseSemver(v) {
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
            if (!m) die(`Version "${v}" is not plain SemVer (X.Y.Z).`);
            return { major: +m[1], minor: +m[2], patch: +m[3] };
          }

          function bump(v, level) {
            const { major, minor, patch } = parseSemver(v);
            if (level === "major") return `${major + 1}.0.0`;
            if (level === "minor") return `${major}.${minor + 1}.0`;
            if (level === "patch") return `${major}.${minor}.${patch + 1}`;
            if (level === "none")  return `${major}.${minor}.${patch}`;
            die(`Unknown bump level: ${level}`);
          }

          const title = process.env.PR_TITLE || "";
          const baseRef = process.env.BASE_REF || "main";

          // Conventional Commits header in PR title:
          //   type(scope)!: subject
          //   type!: subject
          //   type: subject
          const m = /^([a-zA-Z]+)(\([^)]+\))?(!)?:/.exec(title);
          if (!m) die(`PR title is not Conventional Commits: "${title}"`);

          const type = m[1].toLowerCase();
          const breaking = !!m[3];

          // Map PR title -> expected bump
          // Adjust if you want different semantics.
          let level = "none";
          if (breaking) level = "major";
          else if (type === "feat") level = "minor";
          else if (["fix", "perf"].includes(type)) level = "patch";

          let baseJsonRaw;
          try {
            baseJsonRaw = execSync(`git show origin/${baseRef}:version.json`, { encoding: "utf8" });
          } catch {
            die(`Could not read version.json from base branch "${baseRef}".`);
          }

          let baseVersion, prVersion;
          try {
            baseVersion = JSON.parse(baseJsonRaw).version;
          } catch {
            die(`Base branch version.json invalid or missing "version".`);
          }

          try {
            prVersion = JSON.parse(fs.readFileSync("version.json", "utf8")).version;
          } catch {
            die(`PR version.json invalid or missing "version".`);
          }

          if (typeof baseVersion !== "string") die(`Base "version" must be a string.`);
          if (typeof prVersion !== "string") die(`PR "version" must be a string.`);

          const expected = bump(baseVersion, level);

          if (prVersion !== expected) {
            die(
              [
                `version.json mismatch`,
                `Base (${baseRef}) version: ${baseVersion}`,
                `PR title: ${title}`,
                `Computed bump: ${level}`,
                `Expected: ${expected}`,
                `Actual:   ${prVersion}`,
              ].join("\n")
            );
          }

          console.log(`✅ version.json OK: ${prVersion} (base ${baseVersion}, bump ${level})`);
          NODE

  navigation-config-versions:
    name: Validate navigation config versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node (for version check script)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch base branch (for navigation configs on main/base)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Validate navigation config versions match their changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          // Rules (see bots/web_bot_adapter/navigation_config.py):
          //   attributes added   -> major bump: x.y -> (x+1).0
          //   attributes changed -> minor bump: x.y -> x.(y+1)
          //   attributes removed -> never allowed
          const CONFIG_DIR = "bots/web_bot_adapter/navigation_configs";
          const baseRef = process.env.BASE_REF || "main";
          const errors = [];

          function parseVersion(v) {
            const m = typeof v === "string" ? /^(\d+)\.(\d+)$/.exec(v) : null;
            return m ? { major: +m[1], minor: +m[2] } : null;
          }

          // Maps each leaf attribute path (e.g. "selectors.join_button.type") to its JSON-encoded value.
          // Arrays are treated as a single value, so editing a selector list counts as a change.
          function flatten(obj, prefix = "", out = new Map()) {
            for (const [key, value] of Object.entries(obj)) {
              const keyPath = prefix ? `${prefix}.${key}` : key;
              if (value !== null && typeof value === "object" && !Array.isArray(value) && Object.keys(value).length > 0) {
                flatten(value, keyPath, out);
              } else {
                out.set(keyPath, JSON.stringify(value));
              }
            }
            return out;
          }

          function readBase(file) {
            try {
              return execSync(`git show origin/${baseRef}:${file}`, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] });
            } catch {
              return null;
            }
          }

          const baseFiles = execSync(`git ls-tree --name-only origin/${baseRef} -- ${CONFIG_DIR}/`, { encoding: "utf8" })
            .split("\n")
            .filter((f) => f.endsWith(".json"));
          const prFiles = fs.existsSync(CONFIG_DIR)
            ? fs.readdirSync(CONFIG_DIR).filter((f) => f.endsWith(".json")).map((f) => path.posix.join(CONFIG_DIR, f))
            : [];

          for (const file of baseFiles) {
            if (!prFiles.includes(file)) errors.push(`${file}: navigation config files must not be deleted.`);
          }

          for (const file of prFiles) {
            let prConfig;
            try {
              prConfig = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (e) {
              errors.push(`${file}: invalid JSON (${e.message}).`);
              continue;
            }
            const prVersion = parseVersion(prConfig.version);
            if (!prVersion) {
              errors.push(`${file}: "version" must be a string of the form "x.y", got ${JSON.stringify(prConfig.version)}.`);
              continue;
            }

            const baseRaw = readBase(file);
            if (baseRaw === null) {
              console.log(`✅ ${file}: new file at version ${prConfig.version}`);
              continue;
            }
            const baseConfig = JSON.parse(baseRaw);
            const baseVersion = parseVersion(baseConfig.version);
            if (!baseVersion) {
              // Base predates versioning; nothing to compare against.
              console.log(`✅ ${file}: versioning introduced at ${prConfig.version}`);
              continue;
            }

            // "signature" is metadata about the config (checked by the signatures job), not an attribute.
            const { version: _b, signature: _bs, ...baseAttrs } = baseConfig;
            const { version: _p, signature: _ps, ...prAttrs } = prConfig;
            const baseFlat = flatten(baseAttrs);
            const prFlat = flatten(prAttrs);
            const removed = [...baseFlat.keys()].filter((k) => !prFlat.has(k));
            const added = [...prFlat.keys()].filter((k) => !baseFlat.has(k));
            const changed = [...prFlat.keys()].filter((k) => baseFlat.has(k) && baseFlat.get(k) !== prFlat.get(k));

            if (removed.length > 0) {
              errors.push(`${file}: attributes must never be removed, but these were: ${removed.join(", ")}.`);
              continue;
            }

            let expected, reason;
            if (added.length > 0) {
              expected = `${baseVersion.major + 1}.0`;
              reason = `attributes added (${added.join(", ")}), so a major bump is required`;
            } else if (changed.length > 0) {
              expected = `${baseVersion.major}.${baseVersion.minor + 1}`;
              reason = `attributes changed (${changed.join(", ")}), so a minor bump is required`;
            } else {
              expected = baseConfig.version;
              reason = "no attributes changed, so the version must not change";
            }

            if (prConfig.version !== expected) {
              errors.push(`${file}: ${reason}. Base (${baseRef}) version: ${baseConfig.version}, expected: ${expected}, actual: ${prConfig.version}.`);
            } else {
              console.log(`✅ ${file}: ${prConfig.version} (${reason})`);
            }
          }

          if (errors.length > 0) {
            console.error("\n❌ Navigation config version check failed:\n" + errors.map((e) => `  - ${e}`).join("\n") + "\n");
            process.exit(1);
          }
          NODE

  navigation-config-signatures:
    name: Validate navigation config signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install cryptography
        run: pip install "$(grep -E '^cryptography==' requirements.txt)"

      - name: Verify every navigation config has a valid signature
        run: python bots/web_bot_adapter/navigation_config_signing.py verify